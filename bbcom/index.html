<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>草莓甜點屋 | Strawberry Patisserie</title>
    <style>
        :root {
            --primary-pink: #ffb7c5;
            --deep-pink: #e85d75;
            --soft-cream: #fff5f7;
            --accent-green: #7dcfb6;
            --text-dark: #4a3b3c;
            --white: #ffffff;
            --shadow: 0 10px 25px rgba(232, 93, 117, 0.1);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: var(--soft-cream);
            color: var(--text-dark);
            line-height: 1.6;
        }

        /* Navbar */
        header {
            background-color: var(--white);
            box-shadow: var(--shadow);
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            z-index: 1000;
        }

        .nav-container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 1.2rem 2rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo {
            font-size: 1.5rem;
            font-weight: bold;
            color: var(--deep-pink);
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .nav-links {
            list-style: none;
            display: flex;
            gap: 2rem;
        }

        .nav-links a {
            text-decoration: none;
            color: var(--text-dark);
            font-weight: 500;
            transition: color 0.3s ease;
        }

        .nav-links a:hover {
            color: var(--deep-pink);
        }

        /* Hero Section */
        .hero {
            height: 100vh;
            background: linear-gradient(rgba(255, 183, 197, 0.3), rgba(255, 245, 247, 0.8)), 
                        url('https://images.unsplash.com/photo-1565958011703-44f9829ba187?auto=format&fit=crop&q=80&w=1200') no-repeat center center/cover;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 0 1rem;
            margin-top: 60px;
        }

        .hero-content h1 {
            font-size: 3.5rem;
            color: var(--deep-pink);
            margin-bottom: 1rem;
            text-shadow: 2px 2px 4px rgba(255, 255, 255, 0.8);
        }

        .hero-content p {
            font-size: 1.2rem;
            margin-bottom: 2rem;
            color: var(--text-dark);
        }

        .btn {
            display: inline-block;
            background-color: var(--deep-pink);
            color: var(--white);
            padding: 0.8rem 2rem;
            border-radius: 30px;
            text-decoration: none;
            font-weight: bold;
            box-shadow: 0 4px 15px rgba(232, 93, 117, 0.4);
            transition: transform 0.3s ease, background-color 0.3s ease;
        }

        .btn:hover {
            background-color: #d14962;
            transform: translateY(-3px);
        }

        /* Menu Section */
        .menu {
            max-width: 1200px;
            margin: 5rem auto;
            padding: 0 2rem;
        }

        .section-title {
            text-align: center;
            font-size: 2.5rem;
            color: var(--deep-pink);
            margin-bottom: 3rem;
        }

        .menu-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 2rem;
        }

        .menu-card {
            background: var(--white);
            border-radius: 15px;
            overflow: hidden;
            box-shadow: var(--shadow);
            transition: transform 0.3s ease;
        }

        .menu-card:hover {
            transform: translateY(-10px);
        }

        .menu-card img {
            width: 100%;
            height: 200px;
            object-fit: cover;
        }

        .menu-card-content {
            padding: 1.5rem;
        }

        .menu-card-content h3 {
            color: var(--deep-pink);
            margin-bottom: 0.5rem;
        }

        .menu-card-content p {
            color: #666;
            font-size: 0.95rem;
            margin-bottom: 1rem;
        }

        .price {
            font-weight: bold;
            color: var(--text-dark);
            font-size: 1.1rem;
        }

        /* Footer */
        footer {
            background-color: var(--deep-pink);
            color: var(--white);
            text-align: center;
            padding: 2rem;
            margin-top: 5rem;
        }
    </style>
</head>
<body>

    <!-- Navbar -->
    <header>
        <div class="nav-container">
            <div class="logo">🍓 Strawberry Patisserie</div>
            <ul class="nav-links">
                <li><a href="#hero">首頁</a></li>
                <li><a href="#menu">精选甜點</a></li>
                <li><a href="#footer">聯絡我們</a></li>
            </ul>
        </div>
    </header>

    <!-- Hero Section -->
    <section class="hero" id="hero">
        <div class="hero-content">
            <h1>品味戀愛般的酸甜滋味</h1>
            <p>每日新鮮手作草莓甜點，帶給您最幸福的法式浪漫體驗。</p>
            <a href="#menu" class="btn">探索甜點</a>
        </div>
    </section>

    <!-- Menu Section -->
    <section class="menu" id="menu">
        <h2 class="section-title">人氣草莓甜點</h2>
        <div class="menu-grid">
            <div class="menu-card">
                <img src="https://images.unsplash.com/photo-1533134242443-d4fd215305ad?auto=format&fit=crop&q=80&w=500" alt="草莓塔">
                <div class="menu-card-content">
                    <h3>法式經典草莓塔</h3>
                    <p>酥脆塔皮搭配香濃卡士達醬，鋪滿產地直送新鮮草莓。</p>
                    <div class="price">NT$ 180</div>
                </div>
            </div>
            <div class="menu-card">
                <img src="https://images.unsplash.com/photo-1588195538326-c5b1e9f80a1b?auto=format&fit=crop&q=80&w=500" alt="草莓鮮奶油蛋糕">
                <div class="menu-card-content">
                    <h3>草莓鮮奶油蛋糕</h3>
                    <p>輕盈綿密的戚風蛋糕體，夾入雙層新鮮草莓與清爽鮮奶油。</p>
                    <div class="price">NT$ 220</div>
                </div>
            </div>
            <div class="menu-card">
                <img src="https://images.unsplash.com/photo-1579372786545-d24232daf58c?auto=format&fit=crop&q=80&w=500" alt="草莓生乳酪">
                <div class="menu-card-content">
                    <h3>濃郁草莓生乳酪</h3>
                    <p>入口即化的乳酪香氣融合微酸草莓果醬，層次豐富迷人。</p>
                    <div class="price">NT$ 160</div>
                </div>
            </div>
        </div>
    </section>

    <!-- Footer -->
    <footer id="footer">
        <p>&copy; 2026 Strawberry Patisserie. All Rights Reserved.</p>
    </footer>

</body>
</html>
